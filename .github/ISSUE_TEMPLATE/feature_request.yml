name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then your idea. A clear problem often has
        a simpler solution than the first one that comes to mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: "When I prepare a reading for class, I need to …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could STOA help? Sketches and examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What do you do now, or what else did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Token editing
        - AI analysis
        - Dictionary lookup
        - Typography and page layout
        - Export (PDF, PNG, LaTeX)
        - Project files
        - Desktop app
        - A language profile
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to help implement this.
