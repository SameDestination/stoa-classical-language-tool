name: CLA

# Asks first-time contributors to sign CLA.md, and records signatures in
# signatures/cla.json on the `cla-signatures` branch.
#
# pull_request_target runs this workflow from the base branch with write
# access, so it never checks out or runs code from the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/SameDestination/stoa-classical-language-tool/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Must exist and must not be protected. Create it once with:
          #   git push origin main:cla-signatures
          branch: cla-signatures
          allowlist: SameDestination,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read
            the [STOA Contributor License Agreement](https://github.com/SameDestination/stoa-classical-language-tool/blob/main/CLA.md).
            You keep the copyright in your work; the CLA lets STOA be distributed under
            the GPL-3.0-or-later and other terms. To sign, reply to this pull request with the
            sentence below. You only need to do this once.
          create-file-commit-message: "Create CLA signature file"
          signed-commit-message: "Record CLA signature from $contributorName in #$pullRequestNo"
